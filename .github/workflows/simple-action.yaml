name: Simple Action
on: [ push]

jobs:
    simple-action:
        runs-on: ubuntu-latest
        steps:
            - name: Simple JS Action
              id: greeting
              uses: actions/hello-world-javascript-action@v1
              with:
                who-to-greet: 'Ali'
            - name: Log greeting time
              run: echo "Greeting ${{ steps.greeting.outputs.time }}"
            
